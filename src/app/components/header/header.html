<div class="relative">
    <div class="flex gap-2">
        <input type="text" 
            placeholder="Buscador de Productos" 
            class="flex-1 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"
            (input)="alEscribir($event)" />
        
        <button type="button"
            class="px-4 py-2 rounded-lg bg-black text-white font-medium hover:bg-gray-700 transition-colors"
            (click)="alBuscar()">
            Buscar
        </button>
    </div>
</div>
