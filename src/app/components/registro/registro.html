<div class="min-h-screen flex items-center justify-center bg-slate-100 p-6">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-md p-8">
    <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Crear cuenta</h1>

    <form class="space-y-4" (submit)="$event.preventDefault(); registrarse()">
      <div>
        <label for="registro-nombre" class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
        <input
          id="registro-nombre"
          type="text"
          [value]="nombre()"
          (input)="alEscribirNombre($event)"
          placeholder="Tu nombre completo"
          class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"
          [class.border-red-500]="nombreInvalido()"
          [class.border-slate-300]="!nombreInvalido()"
        />
      </div>

      <div>
        <label for="registro-email" class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico</label>
        <input
          id="registro-email"
          type="email"
          [value]="email()"
          (input)="alEscribirEmail($event)"
          placeholder="correo@ejemplo.com"
          class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"
          [class.border-red-500]="emailInvalido()"
          [class.border-slate-300]="!emailInvalido()"
        />
      </div>

      <div>
        <label for="registro-password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input
          id="registro-password"
          type="password"
          [value]="password()"
          (input)="alEscribirPassword($event)"
          placeholder="••••••••"
          class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"
          [class.border-red-500]="passwordInvalido()"
          [class.border-slate-300]="!passwordInvalido()"
        />
      </div>

      <div>
        <label for="registro-confirmar" class="block text-sm font-medium text-slate-700 mb-1">Confirmar contraseña</label>
        <input
          id="registro-confirmar"
          type="password"
          [value]="confirmarPassword()"
          (input)="alEscribirConfirmarPassword($event)"
          placeholder="••••••••"
          class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"
          [class.border-red-500]="confirmarPasswordInvalido()"
          [class.border-slate-300]="!confirmarPasswordInvalido()"
        />
      </div>

      <button
        type="submit"
        class="w-full py-2.5 rounded-xl bg-slate-900 text-white font-medium hover:bg-slate-700 active:scale-95 transition-all duration-150"
      >
        Registrarse
      </button>
    </form>
  </div>
</div>
