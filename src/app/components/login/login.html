<div class="min-h-screen flex items-center justify-center bg-slate-100 p-6">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-md p-8">
    <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Iniciar sesión</h1>

    <form class="space-y-4" (submit)="$event.preventDefault(); iniciarSesion()">
      <div>
        <label for="login-email" class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico</label>
        <input
          id="login-email"
          type="email"
          [value]="email()"
          (input)="alEscribirEmail($event)"
          placeholder="correo@ejemplo.com"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"
        />
      </div>

      <div>
        <label for="login-password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input
          id="login-password"
          type="password"
          [value]="password()"
          (input)="alEscribirPassword($event)"
          placeholder="••••••••"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"
        />
      </div>

      <button
        type="submit"
        class="w-full py-2.5 rounded-xl bg-slate-900 text-white font-medium hover:bg-slate-700 active:scale-95 transition-all duration-150"
      >
        Iniciar sesión
      </button>
    </form>
  </div>
</div>
