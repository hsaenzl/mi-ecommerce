@if(cargando()){
  <div
  class="fixed inset-0 z-50 flex-col items-center justify-center gap-3 bg-slate-900/50 backdrop-blur-sm flex align-middle"
  >
    <div>
      <div class="h-10 w-10 animate-spin rounded-full border-4 border-white/30 border-t-white"></div>
      <p class="text-sm font-medium text-white">Cargando...</p>
    </div>
  </div>
}

<div class="w-full max-w-sm bg-white rounded-2xl shadow-md p-8">
  <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Iniciar sesión</h1>

  <!--<form class="space-y-4" (submit)="$event.preventDefault(); iniciarSesion()">-->
  <form class="space-y-4" [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
    <div>
      <label for="login-email" class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        placeholder="correo@ejemplo.com"
        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"
        [class.border-red-500]="email?.invalid && email?.touched"
        [class.border-slate-300]="!(email?.invalid && email?.touched)"
      />
      @if (email?.invalid && email?.touched) {
        <span class="text-xs text-red-600">Ingresa un correo válido.</span>
      }
    </div>

    <div>
      <label for="login-password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
      <input
        id="login-password"
        type="password"
        formControlName="password"
        placeholder="••••••••"
        class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"
        [class.border-red-500]="password?.invalid && password?.touched"
        [class.border-slate-300]="!(password?.invalid && password?.touched)"
      />
      @if (password?.invalid && password?.touched) {
        <span class="text-xs text-red-600">Mínimo 6 caracteres.</span>
      }
    </div>

    <button
      type="submit"
      class="w-full py-2.5 rounded-xl bg-slate-900 text-white font-medium hover:bg-slate-700 active:scale-95 transition-all duration-150"
    >
      Iniciar sesión
    </button>
  </form>

  <p class="text-center text-sm text-slate-600 mt-4">
    ¿No eres miembro?
    <a
      href="javascript:void(0)"
      class="text-indigo-600 font-medium hover:underline"
      (click)="onClick()"
    >Regístrate ahora</a>
  </p>
</div>
