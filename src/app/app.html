<nav class="flex flex-wrap items-center justify-center gap-3 bg-slate-100 p-4">
  <a
    routerLink="/"
    routerLinkActive="bg-slate-900 text-white"
    [routerLinkActiveOptions]="{ exact: true }"
    class="px-4 py-2 rounded-lg font-medium text-slate-900 transition-colors"
  >
    Inicio
  </a>

  <a
    routerLink="/catalogo"
    routerLinkActive="bg-slate-900 text-white"
    class="px-4 py-2 rounded-lg font-medium text-slate-900 transition-colors"
  >
    Catálogo
  </a>

  <a
    routerLink="/carrito"
    routerLinkActive="bg-slate-900 text-white"
    class="px-4 py-2 rounded-lg font-medium text-slate-900 transition-colors"
  >
    Carrito
    @if (cartService.calcularCantidadArticulos() > 0) {
      <span class="ml-1 inline-flex items-center justify-center min-w-5 h-5 px-1.5 rounded-full bg-emerald-500 text-slate-900 font-bold text-xs">
        {{ cartService.calcularCantidadArticulos() }}
      </span>
    }
  </a>

  <button
    type="button"
    class="px-4 py-2 rounded-lg font-medium transition-colors"
    [class.bg-slate-900]="modalLoginAbierto()"
    [class.text-white]="modalLoginAbierto()"
    [class.text-slate-900]="!modalLoginAbierto()"
    (click)="abrirModalLogin()"
  >
    Iniciar sesión
  </button>

  <!--<a
    routerLink="/registro"
    routerLinkActive="bg-slate-900 text-white"
    class="px-4 py-2 rounded-lg font-medium text-slate-900 transition-colors"
  >
    Registrarse
  </a>-->
</nav>

<router-outlet />

<app-footer />

@if (modalLoginAbierto()) {
  <div
    class="fixed inset-0 z-40 flex items-center justify-center bg-black/50 p-4"
    (click)="cerrarModalLogin()"
  >
    <div class="relative w-full max-w-sm" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="absolute -top-3 -right-3 w-9 h-9 rounded-full bg-white shadow flex items-center justify-center text-lg font-bold text-slate-700 hover:bg-slate-100"
        aria-label="Cerrar"
        (click)="cerrarModalLogin()"
      >
        ×
      </button>

      <!--<app-login (irARegistro)="irARegistroDesdeModal()" />-->
      <app-login (irARegistro)="cerrarModalLogin()" (loginExitoso)="cerrarModalLogin()" />
    </div>
  </div>
}
